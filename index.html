<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Digital Clock</title>
</head>
<body>

<div class="wrapper">
    <h1 class="title">Digital Clock</h1>    
    <div class="container">
        <button id="on-off-button" class="btn"></button>
        <div id="the-clock" class="clock">00:00</div>
        <div class="clock-stand">
            <div class="left-clock-stand"></div>
            <div class="right-clock-stand"></div>
        </div>
    </div>
</div>
<script src="script.js" defer></script>
</body>
</html>
